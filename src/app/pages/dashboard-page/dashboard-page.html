<mat-toolbar class="header">
    <span class="name">TechnologySolution</span>

    <button matIconButton [matMenuTriggerFor]="menu" class="menu-button">
        <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/dashboard">
            <mat-icon>home</mat-icon>
            <span>Inicio</span>
        </button>

        <button mat-menu-item>
            <mat-icon>account_circle</mat-icon>
            <span>Perfil</span>
        </button>

        @if (this.authService.hasRole("administrador") || this.authService.hasRole("gente_e_cultura"))
        {
        <button mat-menu-item routerLink="invite">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Convidar Colaboradores</span>
        </button>
        }

        @if (this.authService.hasRole("administrador") || this.authService.hasRole("gente_e_cultura"))
        {
        <button mat-menu-item routerLink="admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Gerencial</span>
        </button>
        }

        <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Log out</span>
        </button>

    </mat-menu>
</mat-toolbar>
