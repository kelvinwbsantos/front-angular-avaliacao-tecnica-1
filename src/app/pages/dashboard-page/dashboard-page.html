<mat-drawer-container class="container">

  <mat-drawer #drawer class="sidenav">
    <ul class="links">
      <img src="profile-photo-stock.png" class="profile-photo">
      <p>Bem-vindo, {{ payload?.cpf }}!</p>
      <p>Cargo: {{ payload?.role?.toUpperCase() }}!</p>

      @if (payload?.role == 'administrador' || payload?.role == 'gente_e_cultura') {
      <app-invite-component [payload]="payload"></app-invite-component>
      }

      <li (click)="logout()">Sair</li>
    </ul>
  </mat-drawer>

  <mat-drawer-content>

    <button matIconButton class="drawer-toggle" (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>

  </mat-drawer-content>

</mat-drawer-container>
