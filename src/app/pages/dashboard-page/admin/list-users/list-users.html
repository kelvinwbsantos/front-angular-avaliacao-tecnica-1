<mat-card class="user-card">
    <mat-card-header>
        <mat-card-title>Painel de Usuários</mat-card-title>
        <mat-card-subtitle>Filtre e visualize os usuários do sistema</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <!-- Seção de Filtros -->
        <form [formGroup]="filterForm" class="filter-form">
            <mat-form-field appearance="outline">
                <mat-label>Nome</mat-label>
                <input matInput formControlName="name" placeholder="Filtrar por nome">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>E-mail</mat-label>
                <input matInput formControlName="email" placeholder="Filtrar por e-mail">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>CPF</mat-label>
                <input matInput formControlName="cpf" placeholder="Filtrar por CPF">
            </mat-form-field>

            <button mat-stroked-button color="warn" (click)="resetFilters()" type="button">Limpar Filtros</button>
        </form>

        <!-- Seção da Tabela -->
        <div class="table-container">

            @if (isLoading) {
            <div class="spinner-overlay">
                <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
            </div>
            }

            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <!-- Coluna Nome -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef> Nome </th>
                    <td mat-cell *matCellDef="let user"> {{user.name}} </td>
                </ng-container>

                <!-- Coluna E-mail -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef> E-mail </th>
                    <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                </ng-container>

                <!-- Coluna CPF -->
                <ng-container matColumnDef="cpf">
                    <th mat-header-cell *matHeaderCellDef> CPF </th>
                    <td mat-cell *matCellDef="let user"> {{user.cpf}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Linha para quando não há dados -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                        Nenhum usuário encontrado com os filtros aplicados.
                    </td>
                </tr>
            </table>

            <!-- Paginador -->
            <mat-paginator [length]="totalUsers" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"
                aria-label="Selecione a página de usuários">
            </mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
