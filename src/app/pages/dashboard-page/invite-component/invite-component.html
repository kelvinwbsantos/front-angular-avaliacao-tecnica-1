<mat-accordion>
    <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
        <mat-expansion-panel-header>
            <mat-panel-title> Convidar </mat-panel-title>
        </mat-expansion-panel-header>
        <form [formGroup]="form">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" />
            </mat-form-field>
        </form>
        <button matButton="filled" type="submit" [disabled]="form.invalid" (click)="inviteButton()">Enviar</button>

        <h3>Convites Enviados</h3>
        <tr>
            <th>Email</th>
            <th>Validade</th>
        </tr>

        @for (invite of invites; track invite.email) {
        <tr>
            <td>{{ invite.email }}</td>
            <td>{{ invite.status }}</td>
        </tr>
        }
    </mat-expansion-panel>
</mat-accordion>
