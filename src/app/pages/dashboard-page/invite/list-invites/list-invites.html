<mat-card class="invite-card mat-elevation-z8">
  <mat-card-header>
    <mat-card-title>Convites Enviados</mat-card-title>
    <mat-card-subtitle>Acompanhe o status dos seus convites</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="table-container">
      <table mat-table [dataSource]="invites">

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> E-mail </th>
          <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element">

            <mat-chip-listbox aria-label="Status do convite">
              <mat-chip [ngClass]="{
                'chip-pending': element.status === 'Em Aberto', 
                'chip-completed': element.status === 'Finalizado',
                'chip-expired': element.status === 'Vencido'
              }" selected>
                {{element.status}}
              </mat-chip>
            </mat-chip-listbox>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
